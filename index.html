<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InsightIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="css/styles.css"></head>
<body>
<aside id="sb"><div class="logo"><b>IQ</b><span class="lbl">InsightIQ</span></div><nav id="nav"></nav>
<button class="sbtn" id="colb"><svg class="i" viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg><span class="lbl">Collapse</span></button>
<div class="prof"><div class="av">RA</div><div><span id="pn">Ruhi Anana</span><small>Business Analyst</small></div></div></aside>
<main><header>
<button class="ib mob" id="mb" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<h2 id="pt">Overview</h2><div class="sp"></div>
<input class="srch" id="gs" placeholder="Search orders, customers…">
<select id="rng" class="hm" aria-label="Date range"><option value="3">Last 3 months</option><option value="6" selected>Last 6 months</option><option value="12">Last 12 months</option></select>
<button class="ib" id="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg><span class="dot"></span></button>
<button class="ib hm" id="help" aria-label="Help"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg></button>
<button class="av" id="um" style="border:0" aria-label="Account">RA</button>
<div class="menu" id="menu"><button data-a="set">Profile & settings</button><button data-a="imp">Import data</button><button data-a="rst">Reset to demo data</button></div>
</header><div id="view"></div></main>
<div class="modal" id="modal"><div class="mb" id="mbody"></div></div><div id="toasts"></div>
<script src="js/app.js"></script></body></html>
